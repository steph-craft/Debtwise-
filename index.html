<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DebtWise | Debt Management Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
 
</head>
<body>
  <header class="site-header"><div><h1>DebtWise</h1><p>Track what you owe. Pay it down.</p></div>
    <label class="currency">Display currency <select id="currency"><option value="USD">USD</option></select></label>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="sum-h" class="summary">
      <h2 id="sum-h" class="sr-only">Summary</h2>
      <div class="card"><span>Total owed</span><strong id="sum-total">$0.00</strong></div>
      <div class="card"><span>Monthly minimums</span><strong id="sum-min">$0.00</strong></div>
      <div class="card"><span>Paid off</span><strong id="sum-pct">0%</strong>
        <progress id="sum-bar" max="100" value="0"></progress></div>
    </section>
    <div class="layout">
      <section aria-labelledby="form-h" class="card">
        <h2 id="form-h">Add / edit debt</h2>
        <form id="debt-form" novalidate>
          <input type="hidden" name="id">
          <label>Debt name <input name="name" required><small class="err" data-for="name"></small></label>
          <label>Creditor <input name="creditor" required><small class="err" data-for="creditor"></small></label>
          <label>Balance (USD) <input name="balance" type="number" step="0.01" min="0"><small class="err" data-for="balance"></small></label>
          <label>Interest rate (%) <input name="interestRate" type="number" step="0.01" min="0"><small class="err" data-for="interestRate"></small></label>
          <label>Minimum payment (USD) <input name="minPayment" type="number" step="0.01" min="0"><small class="err" data-for="minPayment"></small></label>
          <label>Due date <input name="dueDate" type="date"><small class="err" data-for="dueDate"></small></label>
          <button type="submit" class="btn primary">Save debt</button>
          <button type="reset" class="btn">Clear</button>
        </form>
      </section>
      <section aria-labelledby="list-h">
        <h2 id="list-h">Your debts</h2>
        <div id="debt-list"></div>
      </section>
    </div>
  </main>
   <script type="module" src="js/main.js"></script>
</body>
</html>
